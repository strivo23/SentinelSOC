{% set p=events if events is defined else alerts %}<div class="pagination"><span>Page {{ p.page }} of {{ p.pages }}</span><div>{% if p.page>1 %}<a class="btn small" href="?page={{ p.page-1 }}&q={{ request.args.get('q','') }}">← Previous</a>{% endif %}{% if p.page<p.pages %}<a class="btn small" href="?page={{ p.page+1 }}&q={{ request.args.get('q','') }}">Next →</a>{% endif %}</div></div>
