[project]
name = "sentinelsoc"
version = "1.0.0"
description = "A lightweight rule-based SSH authentication log monitoring dashboard"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "Flask>=3.0,<4",
    "pandas>=2.0,<4",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
